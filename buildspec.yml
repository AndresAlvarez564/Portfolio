version: 0.2

# Portfolio — CodeBuild build specification
# Used by both dev and prod pipelines.
# The DEPLOY_STAGE env var is set by the pipeline: "dev" or "prod"
#
# Flow:
#   1. Install dependencies
#   2. Run Lambda unit tests  ← blocks deploy on failure
#   3. Run frontend tests     ← blocks deploy on failure
#   4. Build frontend
#   5. CDK synth + deploy portfolio-<DEPLOY_STAGE>-AppStack
#   6. Upload frontend to S3
#   7. Invalidate CloudFront cache

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - npm install -g aws-cdk
      - cd infra && npm ci && cd ..
      - cd front && npm ci && cd ..
      - cd lambdas && pip install -r requirements-dev.txt && cd ..

  pre_build:
    commands:
      - echo "Running Lambda unit tests (stage=$DEPLOY_STAGE)..."
      - cd lambdas && pytest --tb=short -q && cd ..
      - echo "Running frontend tests..."
      - cd front && npm run test -- --run && cd ..

  build:
    commands:
      - echo "Building frontend..."
      - cd front && npm run build && cd ..
      - echo "Synthesizing CDK app..."
      - cd infra && npm run build && npx cdk synth && cd ..
      - echo "Deploying portfolio-${DEPLOY_STAGE}-AppStack..."
      - cd infra && npx cdk deploy portfolio-${DEPLOY_STAGE}-AppStack --require-approval never && cd ..

  post_build:
    commands:
      - |
        FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
          --stack-name portfolio-${DEPLOY_STAGE}-AppStack \
          --query "Stacks[0].Outputs[?ExportName=='portfolio-${DEPLOY_STAGE}-frontend-bucket'].OutputValue" \
          --output text)
        DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
          --stack-name portfolio-${DEPLOY_STAGE}-AppStack \
          --query "Stacks[0].Outputs[?ExportName=='portfolio-${DEPLOY_STAGE}-frontend-distribution-id'].OutputValue" \
          --output text)
        echo "Uploading frontend to s3://$FRONTEND_BUCKET..."
        aws s3 sync front/dist s3://$FRONTEND_BUCKET --delete
        echo "Invalidating CloudFront distribution $DISTRIBUTION_ID..."
        aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

artifacts:
  files:
    - "**/*"
  base-directory: front/dist

cache:
  paths:
    - infra/node_modules/**/*
    - front/node_modules/**/*
